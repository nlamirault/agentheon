<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Agentheon">
  <g fill="none" stroke="#d4a533" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- temple: pediment -->
    <path d="M60,13 L102,44 L18,44 Z"/>
    <!-- entablature -->
    <line x1="16" y1="50" x2="104" y2="50"/>
    <!-- side columns (center reserved for caduceus staff) -->
    <line x1="30" y1="54" x2="30" y2="90"/>
    <line x1="44" y1="54" x2="44" y2="90"/>
    <line x1="76" y1="54" x2="76" y2="90"/>
    <line x1="90" y1="54" x2="90" y2="90"/>
    <!-- steps -->
    <line x1="22" y1="95" x2="98" y2="95"/>
    <line x1="16" y1="102" x2="104" y2="102"/>
  </g>
  <!-- caduceus staff: central axis piercing the temple -->
  <line x1="60" y1="13" x2="60" y2="91" stroke="#d4a533" stroke-width="4" stroke-linecap="round"/>
  <!-- wings in the tympanum, flanking the staff head -->
  <g fill="#d4a533" opacity="0.94">
    <path d="M59,40 Q45,30 38,33 Q49,38 59,36 Z"/>
    <path d="M61,40 Q75,30 82,33 Q71,38 61,36 Z"/>
  </g>
  <!-- snakes entwining the shaft, between the inner columns -->
  <g fill="none" stroke="#d4a533" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60,89 C47,82 47,71 60,64 C73,57 73,53 62,52"/>
    <path d="M60,89 C73,82 73,71 60,64 C47,57 47,53 58,52"/>
  </g>
  <!-- finial orb (crowns pediment + caduceus) and snake heads -->
  <g fill="#d4a533">
    <circle cx="60" cy="9" r="4.4"/>
    <circle cx="62" cy="52" r="2.5"/>
    <circle cx="58" cy="52" r="2.5"/>
  </g>
</svg>
