[header]
path = "hack/header.txt"
# A file already carries our header when this token is present; without a
# keyword hawkeye cannot tell a license header from an ordinary comment.
keywords = ["SPDX-License-Identifier"]

[files]
includes = ["*.yml", "*.yaml", "*.toml", "*.sh", "Makefile"]

# agents/*/skills/** are vendored third-party skill packages — keep their upstream
# license/headers intact; never stamp our SPDX header on them.
excludes = [
  "hack/header.txt",
  "*.json",
  "pnpm-lock.yaml",
  "vendor/*",
  "node_modules/*",
  "target/*",
  ".git/*",
  "agents/*/skills/**",
]
