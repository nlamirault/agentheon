# Kubernetes RBAC Examples
# Demonstrates Role-Based Access Control patterns and best practices
# Reference: @references/best-practices.md, @references/security.md

---
# ServiceAccount for Application
apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-app
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: serviceaccount
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Service account for example application"
automountServiceAccountToken: true

---
# Role: Read-Only Access to Pods and Services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-service-reader
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Read-only access to pods and services in production namespace"
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding: Bind Read-Only Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-app-pod-service-reader
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Binds pod-service-reader role to example-app service account"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-service-reader
subjects:
- kind: ServiceAccount
  name: example-app
  namespace: production

---
# Role: Application with ConfigMap and Secret Access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-config-access
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
  resourceNames: ["app-config", "app-feature-flags"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: ["app-credentials", "app-tls"]

---
# Role: Deployment Manager (CI/CD)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-manager
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Allows management of deployments and related resources for CI/CD"
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]

---
# ServiceAccount for CI/CD
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-cd-deployer
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Service account for CI/CD pipeline deployments"
automountServiceAccountToken: false

---
# RoleBinding: Bind Deployment Manager to CI/CD ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-cd-deployment-manager
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-manager
subjects:
- kind: ServiceAccount
  name: ci-cd-deployer
  namespace: production

---
# ClusterRole: Read-Only Access to Nodes and Namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-viewer
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Read-only access to cluster-level resources"
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/status"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]

---
# ClusterRole: Monitoring and Metrics Access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-reader
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Access for monitoring systems to read metrics and health"
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/stats", "nodes/metrics", "nodes/proxy"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list"]

---
# ServiceAccount for Monitoring System
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Service account for Prometheus monitoring"

---
# ClusterRoleBinding: Bind Monitoring Role to Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-monitoring-reader
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-reader
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring

---
# ClusterRole: Namespace Admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-admin
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Full admin access to all resources in assigned namespaces"
rules:
- apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io"]
  resources: ["*"]
  verbs: ["*"]

---
# RoleBinding: Grant Namespace Admin to Team
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-namespace-admin
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Grants production namespace admin access to team"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-admin
subjects:
- kind: Group
  name: team-production
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole: Certificate Signing Request Approver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csr-approver
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests/approval"]
  verbs: ["update"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  resourceNames: ["kubernetes.io/kubelet-serving"]
  verbs: ["approve"]

---
# Role: Log Reader (Debugging)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: log-reader
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Read-only access to pod logs for debugging"
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]

---
# Role: Secret Manager (Automated Secret Rotation)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-manager
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Allows automated tools to manage secrets"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ServiceAccount for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-operator
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Service account for External Secrets Operator"

---
# RoleBinding: Bind Secret Manager to External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-secret-manager
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-manager
subjects:
- kind: ServiceAccount
  name: external-secrets-operator
  namespace: production

---
# ClusterRole: CustomResourceDefinition Manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-manager
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Allows management of CustomResourceDefinitions"
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# Role: PodSecurityPolicy User (Legacy)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: psp-user
  namespace: production
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Allows use of specific PodSecurityPolicy (legacy, for K8s < 1.25)"
rules:
- apiGroups: ["policy"]
  resources: ["podsecuritypolicies"]
  verbs: ["use"]
  resourceNames: ["restricted"]

---
# ClusterRole: Aggregate to View (Read-Only Custom Resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-custom-resources-view
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
    # Aggregate to the default "view" ClusterRole
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
- apiGroups: ["custom.example.com"]
  resources: ["myresources"]
  verbs: ["get", "list", "watch"]

---
# ClusterRole: Aggregate to Edit (Modify Custom Resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aggregate-custom-resources-edit
  labels:
    app.kubernetes.io/name: example-app
    app.kubernetes.io/instance: example-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: iam
    app.kubernetes.io/part-of: example-system
    app.kubernetes.io/managed-by: kubectl
    # Aggregate to the default "edit" ClusterRole
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
- apiGroups: ["custom.example.com"]
  resources: ["myresources"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
